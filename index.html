<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vikrant Mehra</title>
<meta name="description" content="Hi, I'm Vikrant. I build brands and communities from the ground up." />
<link rel="canonical" href="https://vikrantsmehra.github.io/" />
<meta property="og:title" content="Vikrant Mehra" />
<meta property="og:description" content="Hi, I'm Vikrant. I build brands and communities from the ground up." />
<meta property="og:url" content="https://vikrantsmehra.github.io/" />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #fbfbf9; --ink: #131419; --ink-2: #474a55; --muted: #636775; --line: #e1e3e8;
    --hi: rgba(255,196,0,.42); --pen: #c2410c;
    /* backdrop colours, from the shared series palette */
    --mesh-1: #2a78d6; --mesh-2: #e87ba4; --mesh-3: #eda100;
    --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper: #16171c; --ink: #f2f2f4; --ink-2: #c4c6ce; --muted: #8e919d; --line: #2d3038;
    --hi: rgba(237,161,0,.34); --pen: #ffb38a;
    --mesh-1: #3987e5; --mesh-2: #d55181; --mesh-3: #c98500;
    color-scheme: dark; } }
  :root[data-theme="dark"]{
    --paper: #16171c; --ink: #f2f2f4; --ink-2: #c4c6ce; --muted: #8e919d; --line: #2d3038;
    --hi: rgba(237,161,0,.34); --pen: #ffb38a;
    --mesh-1: #3987e5; --mesh-2: #d55181; --mesh-3: #c98500;
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; color: var(--ink); }
  body{ font-family: var(--serif); background: var(--paper); position: relative; overflow-x: hidden; }

  #mesh{ position: fixed; top:0; left:0; width: 100vw; height: 100vh; z-index: 0; }
  #mesh canvas{ display:block; }

  .page{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
  .stage{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 1.5rem 16px 0.75rem;
  }
  .cluster{ width:100%; max-width: 680px; display:flex; flex-direction:column; align-items:center; text-align:center; }

  .eyebrow{
    font-family: var(--mono); font-weight: 500; font-size: 13.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 18px;
  }

  h1{
    font-family: var(--display); font-weight: 800;
    font-size: clamp(36px, 6.4vw, 68px);
    line-height: .98; letter-spacing: -.035em;
    font-variation-settings: "opsz" 96;
    margin: 0 0 28px; max-width: 15ch; text-wrap: balance;
  }
  /* highlighter, not a colour swap — same treatment as the Swipe File masthead */
  h1 em{
    font-style: normal; color: inherit;
    background: linear-gradient(transparent 40%, var(--hi) 40%, var(--hi) 92%, transparent 92%);
    padding: 0 .08em;
  }

  .nav-row{ display:flex; justify-content:center; gap: 2rem; flex-wrap: wrap; }
  .nav-row a{
    text-decoration:none;
    font-family: var(--mono); font-weight: 500; font-size: 15px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink);
    border-bottom: 1.5px solid var(--pen);
    padding-bottom: 3px;
  }
  .nav-row a:hover{ color: var(--pen); }

  footer{
    text-align:center; padding: 0.75rem 16px 1.5rem;
    font-family: var(--mono); font-size: 13px; color: var(--muted);
  }
  footer a{ color: var(--ink-2); }
</style>
</head>
<body>
<div id="mesh"></div>
<div class="page">
  <div class="stage">
    <div class="cluster">
      <span class="eyebrow">Hi! I'm Vikrant</span>
      <h1>I build <em>brands and communities</em> from the ground up.</h1>
      <div class="nav-row">
        <a href="work/">Work</a>
        <a href="play/">Play</a>
        <a href="about/">About</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const {
    ShaderMount, grainGradientFragmentShader, GrainGradientShapes,
    getShaderColorFromString, getShaderNoiseTexture,
  } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.78/+esm');

  const noiseTexture = getShaderNoiseTexture();
  await new Promise((resolve) => {
    if (noiseTexture.complete) resolve();
    else noiseTexture.onload = resolve;
  });

  const mesh = document.getElementById('mesh');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = () => ({
    u_colorBack: getShaderColorFromString(css('--paper')),
    u_colors: ['--mesh-1', '--mesh-2', '--mesh-3'].map((v) => getShaderColorFromString(css(v))),
  });

  const meshMount = new ShaderMount(mesh, grainGradientFragmentShader, {
    u_fit: 2, u_scale: 1, u_rotation: 0,
    u_originX: 0.5, u_originY: 0.5, u_offsetX: 0, u_offsetY: 0,
    u_worldWidth: 0, u_worldHeight: 0,
    ...palette(),
    u_colorsCount: 3,
    u_softness: 0.85,
    u_intensity: 0.22,
    u_noise: 0.55,
    u_shape: GrainGradientShapes.blob,
    u_noiseTexture: noiseTexture,
  }, undefined, 0.4, 0);

  // follow the viewer's light/dark setting
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => meshMount.setUniforms(palette()));

  // ResizeObserver doesn't always fire for this full-viewport mount; drive it manually too
  function syncMeshSize(){
    meshMount.parentWidth = mesh.clientWidth;
    meshMount.parentHeight = mesh.clientHeight;
    meshMount.handleResize();
  }
  syncMeshSize();
  window.addEventListener('resize', syncMeshSize);
</script>
</body>
</html>
