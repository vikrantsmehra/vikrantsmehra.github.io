<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  /* set theme before paint to avoid a flash; choice is shared across the whole site */
  (function () {
    try {
      var t = localStorage.getItem("vm-theme") ||
        ((window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  })();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vikrant Mehra</title>
<meta name="description" content="Hi, I'm Vikrant. I build brands and communities from the ground up." />
<link rel="canonical" href="https://vikrant.space/" />
<meta property="og:title" content="Vikrant Mehra" />
<meta property="og:description" content="Hi, I'm Vikrant. I build brands and communities from the ground up." />
<meta property="og:url" content="https://vikrant.space/" />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #fbfbf9; --ink: #131419; --ink-2: #474a55; --muted: #636775; --line: #e1e3e8;
    --hi: rgba(255,196,0,.42); --pen: #c2410c;
    /* backdrop colours, from the shared series palette */
    --mesh-1: #2a78d6; --mesh-2: #e87ba4; --mesh-3: #eda100;
    --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper: #16171c; --ink: #f2f2f4; --ink-2: #c4c6ce; --muted: #8e919d; --line: #2d3038;
    --hi: rgba(237,161,0,.34); --pen: #ffb38a;
    --mesh-1: #3987e5; --mesh-2: #d55181; --mesh-3: #c98500;
    color-scheme: dark; } }
  :root[data-theme="dark"]{
    --paper: #16171c; --ink: #f2f2f4; --ink-2: #c4c6ce; --muted: #8e919d; --line: #2d3038;
    --hi: rgba(237,161,0,.34); --pen: #ffb38a;
    --mesh-1: #3987e5; --mesh-2: #d55181; --mesh-3: #c98500;
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; color: var(--ink); }
  body{ font-family: var(--serif); background: var(--paper); position: relative; overflow-x: hidden; }

  #mesh{ position: fixed; top:0; left:0; width: 100vw; height: 100vh; z-index: 0; }
  #mesh canvas{ display:block; }

  .page{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
  .stage{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 1.5rem 16px 0.75rem;
  }
  .cluster{ width:100%; max-width: 680px; display:flex; flex-direction:column; align-items:center; text-align:center; }


  h1{
    font-family: var(--display); font-weight: 800;
    font-size: clamp(36px, 6.4vw, 68px);
    line-height: .98; letter-spacing: -.035em;
    font-variation-settings: "opsz" 96;
    margin: 0 0 18px; max-width: 15ch; text-wrap: balance;
  }
  .dek{
    font-family: var(--serif); font-size: clamp(19px, 2.4vw, 23px); line-height: 1.45;
    color: var(--ink); max-width: 30ch; margin: 0 0 28px; text-wrap: balance;
  }
  .dek em{
    font-style: normal; color: var(--ink);
    background: linear-gradient(transparent 40%, var(--hi) 40%, var(--hi) 92%, transparent 92%);
    padding: 0 .08em;
  }

  /* highlighter, not a colour swap — same treatment as the Swipe File masthead */
  h1 em{
    font-style: normal; color: inherit;
    background: linear-gradient(transparent 40%, var(--hi) 40%, var(--hi) 92%, transparent 92%);
    padding: 0 .08em;
  }

  .nav-row{ display:flex; justify-content:center; gap: 2rem; flex-wrap: wrap; }
  .nav-row a{
    text-decoration:none;
    font-family: var(--mono); font-weight: 500; font-size: 15px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink);
    border-bottom: 1.5px solid var(--pen);
    padding-bottom: 3px;
  }
  .nav-row a:hover{ color: var(--pen); }

  footer{
    text-align:center; padding: 0.75rem 16px 1.5rem;
    font-family: var(--mono); font-size: 13px; color: var(--muted);
  }
  footer a{ color: var(--ink-2); }

.corner-switch{ position:absolute; top: 20px; right: 16px; z-index: 3; }
/* ---- light switch (theme toggle), from the Swipe File ---- */
:root{ --switch-track: #e1e3e8; --switch-knob: #ffffff; --switch-ic: #c98500; --switch-line: #868996; --switch-focus: #2a78d6; }
:root[data-theme="dark"]{ --switch-track: #2d3038; --switch-knob: #474a55; --switch-ic: #f2f2f4; --switch-line: #6b6e7a; }
.switch{ border: 0; background: none; padding: 0; margin: 0; cursor: pointer; display: inline-flex; line-height: 0; }
.switch__track{ position: relative; display: block; width: 48px; height: 26px; border-radius: 999px;
  background: var(--switch-track); border: 1px solid var(--switch-line); transition: background .2s ease; }
.switch__knob{ position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--switch-knob); box-shadow: 0 1px 3px rgba(0,0,0,.28);
  display: flex; align-items: center; justify-content: center;
  transition: transform .22s cubic-bezier(.4,0,.2,1), background .2s ease; }
:root[data-theme="dark"] .switch__knob{ transform: translateX(22px); }
.switch__knob svg{ width: 12px; height: 12px; display: block; color: var(--switch-ic); }
.switch__moon{ display: none; }
:root[data-theme="dark"] .switch__sun{ display: none; }
:root[data-theme="dark"] .switch__moon{ display: block; }
.switch:focus-visible .switch__track{ outline: 2px solid var(--switch-focus); outline-offset: 2px; }
@media (hover: none){ .switch{ padding: 9px 0; } }
</style>
</head>
<body>
<div id="mesh"></div>
<div class="page">
  <div class="corner-switch"><button id="theme-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Dark theme" title="Toggle light / dark">
      <span class="switch__track">
        <span class="switch__knob">
          <svg class="switch__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="switch__moon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </span>
    </button></div>
  <div class="stage">
    <div class="cluster">
      <h1>Hi! I'm Vikrant</h1>
      <p class="dek">I build <em>brands and communities</em> from the ground up.</p>
      <div class="nav-row">
        <a href="work/">Work</a>
        <a href="play/">Play</a>
        <a href="about/">About</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const {
    ShaderMount, grainGradientFragmentShader, GrainGradientShapes,
    getShaderColorFromString, getShaderNoiseTexture,
  } = await import('https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.78/+esm');

  const noiseTexture = getShaderNoiseTexture();
  await new Promise((resolve) => {
    if (noiseTexture.complete) resolve();
    else noiseTexture.onload = resolve;
  });

  const mesh = document.getElementById('mesh');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = () => ({
    u_colorBack: getShaderColorFromString(css('--paper')),
    u_colors: ['--mesh-1', '--mesh-2', '--mesh-3'].map((v) => getShaderColorFromString(css(v))),
  });

  const meshMount = new ShaderMount(mesh, grainGradientFragmentShader, {
    u_fit: 2, u_scale: 1, u_rotation: 0,
    u_originX: 0.5, u_originY: 0.5, u_offsetX: 0, u_offsetY: 0,
    u_worldWidth: 0, u_worldHeight: 0,
    ...palette(),
    u_colorsCount: 3,
    u_softness: 0.85,
    u_intensity: 0.22,
    u_noise: 0.55,
    u_shape: GrainGradientShapes.blob,
    u_noiseTexture: noiseTexture,
  }, undefined, 0.4, 0);

  // follow the viewer's light/dark setting
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => meshMount.setUniforms(palette()));
  new MutationObserver(() => meshMount.setUniforms(palette())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ResizeObserver doesn't always fire for this full-viewport mount; drive it manually too
  function syncMeshSize(){
    meshMount.parentWidth = mesh.clientWidth;
    meshMount.parentHeight = mesh.clientHeight;
    meshMount.handleResize();
  }
  syncMeshSize();
  window.addEventListener('resize', syncMeshSize);
</script>

<script>
  (function () {
    var root = document.documentElement, sw = document.getElementById("theme-switch");
    if (!sw) return;
    function sync(){ sw.setAttribute("aria-checked", root.getAttribute("data-theme") === "dark" ? "true" : "false"); }
    sync();
    sw.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("vm-theme", next); } catch (e) {}
      sync();
    });
  })();
</script>
</body>
</html>
